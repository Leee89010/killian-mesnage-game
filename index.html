<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{background:#131314;margin:0;padding:40px;display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start;}
.big svg{width:600px;height:auto;background:#1b1b1d;border:1px solid #333;}
.small svg{width:280px;height:auto;background:#1b1b1d;border:1px solid #333;}
</style></head>
<body>
<div class="big">
<svg viewBox="0 0 320 190" xmlns="http://www.w3.org/2000/svg" id="bikesvg">
  <ellipse cx="155" cy="170" rx="135" ry="9" fill="rgba(0,0,0,0.4)"/>

  <!-- SWINGARM -->
  <path d="M134 122 L 60 146" stroke="#161616" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- CADRE (un seul tube net) -->
  <path d="M206 80 C 182 86, 160 96, 134 122" fill="none" stroke="#9fa4ac" stroke-width="6" stroke-linecap="round"/>

  <!-- SILENCIEUX -->
  <path d="M62 120 C 62 113, 71 108, 90 108 C 110 108, 121 115, 121 126 C 121 137, 110 144, 90 144 C 71 144, 62 139, 62 132 Z"
        fill="#dfe2e7" stroke="#8a8f98" stroke-width="1.5"/>
  <rect x="117" y="119" width="11" height="13" rx="2" fill="#2c2c30"/>
  <path d="M166 116 C 152 120, 136 121, 121 124" fill="none" stroke="#c7cad1" stroke-width="7" stroke-linecap="round"/>

  <!-- MOTEUR -->
  <rect x="128" y="106" width="42" height="32" rx="5" fill="#2c2c30" stroke="#161616" stroke-width="2"/>
  <circle cx="149" cy="122" r="8" fill="#161616"/>

  <!-- REPOSE-PIED -->
  <path d="M130 130 L 118 140" stroke="#161616" stroke-width="4.5" stroke-linecap="round"/>

  <!-- FOURCHE -->
  <path d="M240 146 L 205 76" stroke="#161616" stroke-width="14" stroke-linecap="round"/>
  <path d="M240 146 L 205 76" stroke="#eceef1" stroke-width="9" stroke-linecap="round"/>
  <path d="M245 124 L 227 90 L 236 87 L 253 120 Z" fill="#161616"/>

  <!-- TE DE FOURCHE -->
  <rect x="197" y="70" width="18" height="12" rx="2" fill="#3a3a3a" transform="rotate(-25 206 76)"/>

  <!-- GUIDON -->
  <path d="M206 76 L 204 52" stroke="#3a3a3a" stroke-width="5"/>
  <path d="M174 49 L 232 49" stroke="#161616" stroke-width="7" stroke-linecap="round"/>
  <circle cx="174" cy="49" r="6.5" fill="#2c2c30"/>
  <circle cx="232" cy="49" r="6.5" fill="#2c2c30"/>

  <!-- GARDE-BOUE AVANT -->
  <path d="M213 104 C 222 84, 258 80, 270 106 C 271 110, 268 112, 266 109 C 254 88, 226 91, 219 108 C 217 112, 211 109, 213 104 Z"
        fill="#e2321e" stroke="#161616" stroke-width="1.5"/>

  <!-- SELLE (dessinee AVANT le tank pour que le tank la chevauche legerement) -->
  <path d="M180 106 L 100 100 L 90 108 L 92 116 L 180 118 Z" fill="#161616"/>

  <!-- CARENAGES / RESERVOIR : grande forme bloc anguleuse -->
  <path d="M172 110
           L 174 88
           C 175 70, 188 58, 208 55
           L 216 68
           C 200 71, 190 82, 188 96
           L 198 106
           C 190 112, 180 112, 172 110 Z"
        fill="#e2321e" stroke="#161616" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- bande turquoise -->
  <path d="M184 88 C 190 76, 200 65, 211 60" fill="none" stroke="#2ad6d1" stroke-width="6" stroke-linecap="round"/>
  <!-- plaque numero -->
  <rect x="180" y="69" width="29" height="22" rx="2" fill="#f4efe2" stroke="#161616" stroke-width="2.5" transform="rotate(-18 194.5 80)"/>
  <text x="194" y="88" font-size="16" font-weight="900" text-anchor="middle" fill="#161616" font-family="Arial, sans-serif" transform="rotate(-18 194.5 80)">1</text>

  <!-- GARDE-BOUE ARRIERE -->
  <path d="M96 116 C 88 92, 54 84, 34 104 C 31 107, 34 111, 37 108 C 54 92, 84 98, 91 118 C 92 121, 95 120, 96 116 Z"
        fill="#e2321e" stroke="#161616" stroke-width="1.5"/>

  <!-- ROUE ARRIERE -->
  <g transform="translate(60,146)">
    <g id="wheel-rear">
      <circle r="31" fill="#141414"/>
      <circle r="31" fill="none" stroke="#3a3a3a" stroke-width="4"/>
      <circle r="19" fill="none" stroke="#8a8f98" stroke-width="2"/>
      <circle r="5" fill="#c7cad1"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(0)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(60)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(120)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(240)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(300)"/>
      <g stroke="#0a0a0a" stroke-width="3.6" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(0)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(30)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(60)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(90)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(120)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(150)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(180)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(210)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(240)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(270)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(300)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(330)"/>
      </g>
    </g>
  </g>

  <!-- ROUE AVANT -->
  <g transform="translate(240,146)">
    <g id="wheel-front">
      <circle r="31" fill="#141414"/>
      <circle r="31" fill="none" stroke="#3a3a3a" stroke-width="4"/>
      <circle r="19" fill="none" stroke="#8a8f98" stroke-width="2"/>
      <circle r="22" fill="none" stroke="#c7cad1" stroke-width="1.5" stroke-dasharray="2 4"/>
      <circle r="5" fill="#c7cad1"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(0)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(60)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(120)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(240)"/>
      <line x1="0" y1="0" x2="0" y2="-19" stroke="#8a8f98" stroke-width="1.6" transform="rotate(300)"/>
      <g stroke="#0a0a0a" stroke-width="3.6" stroke-linecap="round">
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(0)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(30)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(60)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(90)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(120)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(150)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(180)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(210)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(240)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(270)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(300)"/>
        <line x1="0" y1="-28" x2="0" y2="-34" transform="rotate(330)"/>
      </g>
    </g>
  </g>
</svg>
</div>
<div class="small" id="small-container"></div>
<script>
document.getElementById('small-container').innerHTML = document.getElementById('bikesvg').outerHTML;
</script>
</body></html>
